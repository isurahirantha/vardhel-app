services:
  db:
    image: mysql:8.0
    container_name: vardhel-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: vardhel
      MYSQL_USER: vardhel_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - vardhel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vardhel-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://vardhel_user:${DB_PASSWORD}@db:3306/vardhel
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - vardhel_uploads:/app/storage

volumes:
  vardhel_mysql_data:
  vardhel_uploads:
